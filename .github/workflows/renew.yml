name: Renew KataBump

on:
  schedule:
    # 每天 UTC 0 点运行，你可以根据需要调整时间
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y xvfb wget curl gnupg lsb-release
          # 安装 Google Chrome（脚本使用 undetected-chromedriver，需要 Chrome）
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install and configure Cloudflare WARP (Proxy Mode)
        run: |
          # 导入 Cloudflare WARP 的 GPG 密钥
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          # 添加软件源
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          # 安装 WARP 客户端
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

          # 注册新设备并接受服务条款
          sudo warp-cli --accept-tos registration new
          # 设置为代理模式
          sudo warp-cli --accept-tos set-mode proxy
          # 启动连接（默认 SOCKS5 端口为 40000）
          sudo warp-cli --accept-tos connect

          # 等待几秒让代理稳定
          sleep 5
          # 验证 WARP 代理是否生效（可选）
          echo "Checking WARP proxy status..."
          curl -s -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep "warp" || true

      - name: Run Renew Script
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 使用 WARP 的本地 SOCKS5 代理
          PROXY_URL: "socks5://127.0.0.1:40000"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 main.py
