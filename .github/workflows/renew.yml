name: Katabump Auto Renew
on:
  schedule:
    # 每天 UTC 0 点（北京时间 8 点）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: Install and configure Cloudflare WARP (Proxy Mode)
        run: |
          # 导入 Cloudflare WARP 的 GPG 密钥
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          # 添加软件源
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          # 安装 WARP 客户端
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

          # 注册新设备并接受服务条款
          sudo warp-cli --accept-tos registration new
          # 设置为代理模式（注意命令已更新）
          sudo warp-cli --accept-tos mode proxy
          # 启动连接（默认 SOCKS5 端口为 40000）
          sudo warp-cli --accept-tos connect

          # 等待几秒让代理稳定
          sleep 5
          # 验证 WARP 代理是否生效
          echo "Checking WARP proxy status..."
          curl -s -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep "warp" || true
          
      - name: Run Renew Script
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          PROXY_SERVER: socks5://127.0.0.1:40000
          IS_PROXY: 'true'
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 main.py

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-artifacts
          path: |
            *.png
            screenshots/
          if-no-files-found: ignore
